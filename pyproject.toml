[project]
name = "wxc-cli"
version = "0.1.0"
description = "Auto-generated CLI for the wxc_sdk Webex SDK"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "keyring>=25.7.0",
    "python-dotenv>=1.2.2",
    "rich>=14.3.3",
    "typer>=0.24.1",
    "wxc-sdk>=1.30.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
wxc-cli = "wxc_cli.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/wxc_cli"]

[tool.ruff]
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "ruff>=0.15.6",
]
