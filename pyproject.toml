[project]
name = "wxc-cli"
version = "0.1.0"
description = "Auto-generated CLI for the wxc_sdk Webex SDK"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "keyring>=25.7.0",
    "python-dotenv>=1.2.2",
    "rich>=14.3.3",
    "typer>=0.24.1",
    "wxc-sdk>=1.30.0",
]

[dependency-groups]
dev = [
    "commitizen>=4.13.9",
    "pre-commit>=4.5.1",
    "ruff>=0.15.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
wxc-cli = "wxc_cli.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/wxc_cli"]

[tool.ruff]
line-length = 120
src = ["src"]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
ignore = [
    'C901',
    "E741",
]
select = [
    "E",   # pycodestyle errors (flake8 core)
    "W",   # pycodestyle warnings (flake8 core)
    "F",   # pyflakes (flake8 core)
    "C90", # mccabe complexity (flake8-mccabe)
    "I",   # isort (flake8-isort)
    # "N",   # pep8-naming (flake8-pep8-naming)
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]

[tool.ruff.lint.per-file-ignores]
"src/wxc_cli/cli.py" = [
    'B007',
    'B904',
    'F841',
    'UP045',
]

[tool.commitizen]
name = "cz_conventional_commits"
version_scheme = "semver"
version_provider = "uv"   # reads/writes version in [project] table
tag_format = "v$version"
update_changelog_on_bump = true

