[project]
name = "wxc-cli"
version = "0.4.0"
description = "Auto-generated CLI for the wxc_sdk Webex SDK"
authors = [{ name = "Johannes Krohn", email = "jkrohn@cisco.com" }]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11,<3.14"
keywords = ["webex", "cli", "wxc_sdk", "cisco", "webex-calling", "api"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Telecommunications Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications",
    "Topic :: Utilities",
]
dependencies = [
    "keyring>=25.7.0",
    "python-dotenv>=1.2.2",
    "rich>=14.3.3",
    "typer>=0.24.1",
    "wxc-sdk>=1.30.0",
]

[dependency-groups]
dev = [
    "commitizen>=4.13.9",
    "pre-commit>=4.5.1",
    "ruff>=0.15.6",
]

[project.urls]
Homepage = "https://github.com/jeokrohn/wxc-cli"
Repository = "https://github.com/jeokrohn/wxc-cli"
"Bug Tracker" = "https://github.com/jeokrohn/wxc-cli/issues"
Changelog = "https://github.com/jeokrohn/wxc-cli/blob/main/CHANGELOG.md"

[project.scripts]
wxc-cli = "wxc_cli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.hatch.build.targets.wheel]
packages = ["src/wxc_cli"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/CHANGELOG.md",
    "/LICENSE",
    "/Makefile",
    "/pyproject.toml",
    "/README.md",
]

[tool.ruff]
line-length = 120
src = ["src"]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
ignore = [
    'C901',
    "E741",
]
select = [
    "E", # pycodestyle errors (flake8 core)
    "W", # pycodestyle warnings (flake8 core)
    "F", # pyflakes (flake8 core)
    "C90", # mccabe complexity (flake8-mccabe)
    "I", # isort (flake8-isort)
    # "N",   # pep8-naming (flake8-pep8-naming)
    "B", # flake8-bugbear
    "UP", # pyupgrade
]

[tool.ruff.lint.per-file-ignores]
"src/wxc_cli/cli.py" = [
    'B007',
    'B904',
    'F841',
    'UP045',
]

[tool.commitizen]
name = "cz_conventional_commits"
version_scheme = "semver"
version_provider = "uv"   # reads/writes version in [project] table
tag_format = "v$version"
update_changelog_on_bump = true
version_files = [
    "src/wxc_cli/cli.py"
]

