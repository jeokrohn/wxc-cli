[project]
name = "wxc-cli"
version = "0.1.0"
description = "Auto-generated CLI for the wxc_sdk Webex SDK"
requires-python = ">=3.10,<3.14"
dependencies = [
    "keyring>=25.7.0",
    "python-dotenv>=1.2.2",
    "rich>=14.3.3",
    "typer>=0.24.1",
    "wxc-sdk>=1.30.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "ruff>=0.15.6",
]
